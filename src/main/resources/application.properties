# HTTP
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# CORS (React/Vite + Render)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://alpha-web-b9w8.onrender.com,https://alpha-api-eqfa.onrender.com}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true

# Swagger / OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

# OpenAPI Info
quarkus.smallrye-openapi.info-title=Alpha Steel API
quarkus.smallrye-openapi.info-version=1.0
quarkus.smallrye-openapi.info-description=This is the official API documentation for Alpha Steel. It lists the available endpoints and how to authenticate using Bearer JWT.

# Datasource (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:alpha}
quarkus.datasource.password=${DB_PASS:alpha}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/alpha}

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.schema-management.halt-on-error=true

# Security permissions
quarkus.http.auth.permission.public.paths=/api/v1/auth,/api/v1/auth/*,/swagger-ui/*,/openapi,/q/swagger-ui/*,/q/openapi
quarkus.http.auth.permission.public.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# JWT (verify + sign)
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
mp.jwt.verify.issuer=${JWT_ISSUER:https://alpha-api-eqfa.onrender.com}
smallrye.jwt.new-token.issuer=${JWT_ISSUER:https://alpha-api-eqfa.onrender.com}
smallrye.jwt.new-token.lifespan=600

# Refresh token
app.security.refresh-token-ttl-minutes=30

# Password reset
app.frontend.base-url=${FRONTEND_URL:https://alpha-web-b9w8.onrender.com}
app.security.reset-token-ttl-minutes=30

# Email (Resend) - preferred on Render (no SMTP)
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.from=${RESEND_FROM:}

# SMTP (Gmail) - keep only if you use paid hosting that allows SMTP egress
# quarkus.mailer.from=${SMTP_FROM:${SMTP_USERNAME}}
# quarkus.mailer.host=${SMTP_HOST:smtp.gmail.com}
# quarkus.mailer.port=${SMTP_PORT:587}
# quarkus.mailer.start-tls=REQUIRED
# quarkus.mailer.username=${SMTP_USERNAME}
# quarkus.mailer.password=${SMTP_PASSWORD}
# quarkus.mailer.keep-alive=true
# quarkus.mailer.pool-size=1
# quarkus.mailer.connection-timeout=15S
# quarkus.mailer.timeout=60S

# Mock mode only for tests
%dev.quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.mock=false
