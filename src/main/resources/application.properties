# HTTP
quarkus.http.port=${PORT:8080}


# CORS (React/Vite)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true

# Swagger / OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

# OpenAPI Info (title/description shown on /openapi and Swagger UI)
quarkus.smallrye-openapi.info-title=Alpha Steel API
quarkus.smallrye-openapi.info-version=1.0
quarkus.smallrye-openapi.info-description=This is the official API documentation for Alpha Steel. It lists the available endpoints and how to authenticate using Bearer JWT.

# Datasource (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:alpha}
quarkus.datasource.password=${DB_PASS:alpha}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/alpha}


# Hibernate
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.schema-management.halt-on-error=true

# Security permissions
quarkus.http.auth.permission.public.paths=/api/v1/auth/*,/swagger-ui/*,/openapi,/q/swagger-ui/*,/q/openapi
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# JWT (verify + sign)
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
mp.jwt.verify.issuer=${JWT_ISSUER:http://localhost:8080}
smallrye.jwt.new-token.issuer=${JWT_ISSUER:http://localhost:8080}
smallrye.jwt.new-token.lifespan=600

# Refresh token
app.security.refresh-token-ttl-minutes=30


# Password reset
app.frontend.base-url=${FRONTEND_URL:http://localhost:5173}
app.security.reset-token-ttl-minutes=30

# Mailer Configuration
# SMTP provider: Outlook/Hotmail
quarkus.mailer.from=${SMTP_FROM:no-reply@alphasteel.com}
quarkus.mailer.host=${SMTP_HOST:smtp-mail.outlook.com}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${SMTP_USERNAME}
quarkus.mailer.password=${SMTP_PASSWORD}

# Mock mode only for tests
%dev.quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.mock=false
