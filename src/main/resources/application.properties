# HTTP
quarkus.http.port=8080

# CORS (React/Vite)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true


# Swagger / OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

# OpenAPI Info (title/description shown on /openapi and Swagger UI)
quarkus.smallrye-openapi.info-title=Alpha Steel API
quarkus.smallrye-openapi.info-version=1.0
quarkus.smallrye-openapi.info-description=This is the official API documentation for Alpha Steel. It lists the available endpoints and how to authenticate using Bearer JWT.


# Datasource (Oracle)
quarkus.datasource.db-kind=oracle
quarkus.datasource.username=${DB_USER:alpha}
quarkus.datasource.password=${DB_PASS:alpha}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}


# Hibernate
quarkus.datasource.jdbc.generation=update
quarkus.hibernate-orm.log.sql=false

# Security permissions
quarkus.http.auth.permission.public.paths=/api/v1/auth/*,/swagger-ui/*,/openapi,/q/swagger-ui/*,/q/openapi
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# JWT (verify + sign)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://alpha-api.local
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=https://alpha-api.local
smallrye.jwt.new-token.lifespan=3600

# Password reset
app.frontend.base-url=http://localhost:5173
app.security.reset-token-ttl-minutes=30

# Mailer (DEV/TEST)
quarkus.mailer.mock=true
quarkus.mailer.from=no-reply@alphasteel.local
